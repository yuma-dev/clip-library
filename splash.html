<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-app-region: no-drag;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: appear 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform, opacity;
      }
      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .logo {
        width: 140px;
        height: 140px;
        object-fit: contain;
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.9));
        will-change: transform;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      .bar {
        width: 200px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        transform: translateX(-115%);
        animation: sweep 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        will-change: transform;
      }
      @keyframes appear {
        from { opacity: 0; transform: scale(0.88); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes sweep {
        0%       { transform: translateX(-115%); }
        72%, to  { transform: translateX(115%);  }
      }
      body.dismiss .wrap {
        animation: disappear 0.28s ease-in forwards;
      }
      @keyframes disappear {
        to { opacity: 0; transform: scale(0.92); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="content">
        <img
          class="logo"
          src="assets/title.png"
          alt="ClipLib"
          draggable="false"
          decoding="sync"
          fetchpriority="high"
        />
        <div class="bar"><span></span></div>
      </div>
    </div>
  </body>
</html>
